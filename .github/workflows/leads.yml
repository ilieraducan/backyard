name: leads
on:
  push:
    branches: [kira-tmp]
    paths: ["leads/run.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: leads, cancel-in-progress: true }
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { ref: kira-tmp }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cd leads && curl -sL -o t.zip https://tranco-list.eu/top-1m.csv.zip && unzip -o t.zip >/dev/null && wc -l top-1m.csv
          S=$(( ${{ matrix.part }} * 250000 )); node find.mjs $S $(( S + 250000 ))
          npm install --no-audit --no-fund >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node scan.mjs leads-$S.json 200
          P=${{ matrix.part }}
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in leads-$S.json -out part$P.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey lead.pub -in k.txt -out part$P.key.enc
          rm -f leads-*.json k.txt top-1m.csv t.zip
          git config user.name a11y-bot && git config user.email a11y-bot@users.noreply.github.com
          git add part$P.enc part$P.key.enc && git commit -m "leads part $P"
          for i in 1 2 3 4 5; do git pull --rebase origin kira-tmp && git push origin HEAD:kira-tmp && break; sleep $((RANDOM % 20 + 5)); done
