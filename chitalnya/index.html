<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Читальня</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Читальня">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#26575B">
<style>
  :root{--bg:#21474B;--fg:#FBF8F0;--muted:#B9CFCC;--gold:#D9A441}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:linear-gradient(#2F6A6F,#21474B);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:calc(24px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  img{width:132px;height:132px;border-radius:30px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  h1{font-family:Georgia,"PT Serif",serif;font-size:34px;margin:0}
  p{margin:0;color:var(--muted);max-width:26rem;line-height:1.5}
  a.btn{display:inline-block;background:var(--fg);color:#21474B;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:14px;font-size:17px}
  .how{font-size:14px;text-align:left;background:rgba(0,0,0,.18);border-radius:14px;padding:14px 16px;max-width:26rem}
  .how b{color:var(--fg)}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Читальня</h1>
  <p id="msg">Открываю…</p>
  <a class="btn" id="go" href="https://claude.ai/artifact/1RRctT6vu8DJ5ZHEZ4rHHf">Открыть Читальню</a>
  <div class="how" id="how" hidden>
    <b>Установить как приложение:</b><br>
    iPhone/iPad (Safari): «Поделиться» → «На экран „Домой“».<br>
    Android (Chrome): меню ⋮ → «Установить приложение» или «Добавить на главный экран».<br>
    Компьютер (Chrome/Edge): значок установки в адресной строке.
  </div>
</main>
<script>
  const URL_APP = "https://claude.ai/artifact/1RRctT6vu8DJ5ZHEZ4rHHf";
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true || location.search.includes("app=1");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (standalone) { location.replace(URL_APP); }
  else { document.getElementById("msg").textContent = "Личная читалка: книги, Библия и цитаты."; document.getElementById("how").hidden = false; }
</script>
</body>
</html>
